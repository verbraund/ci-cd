name: First workflow
on: push

jobs:
    First-job:
        runs-on: ubuntu-latest
        steps:
            - name: show php version
              run: php -v
            - name: show php modules
              run: php -m
            - name: show composer version
              run: composer -V
    Second-job:
        runs-on: ubuntu-latest
        needs: [First-job]
        steps:
            - name: show node version
              run: node -v
            - name: show npm version
              run: npm -v